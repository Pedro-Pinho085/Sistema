<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão de Clientes e Produtos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f6fa;
            --surface: #ffffff;
            --surface-alt: #f8f9fc;
            --border: #e4e7ef;
            --text: #1d2433;
            --text-muted: #6b7385;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-soft: #eef0ff;
            --accent: #0ea5a4;
            --accent-soft: #e6f7f6;
            --success: #15803d;
            --success-soft: #e9f8ee;
            --danger: #c2334a;
            --danger-soft: #fdecef;
            --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 4px 16px rgba(16, 24, 40, 0.06);
            --radius: 14px;
            --radius-sm: 9px;
            color-scheme: light;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0f1320;
                --surface: #171c2b;
                --surface-alt: #1d2334;
                --border: #2a3147;
                --text: #e7eaf3;
                --text-muted: #949cb2;
                --primary: #818cf8;
                --primary-hover: #a5b0fb;
                --primary-soft: #252a4a;
                --accent: #2dd4bf;
                --accent-soft: #163634;
                --success: #4ade80;
                --success-soft: #16301f;
                --danger: #f87185;
                --danger-soft: #3a1c24;
                --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
                color-scheme: dark;
            }
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        .pagina {
            max-width: 1180px;
            margin: 0 auto;
            padding: 32px 24px 56px;
        }

        /* ---------- Cabeçalho ---------- */
        .topo {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .marca {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .marca-icone {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #fff;
            flex-shrink: 0;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .subtitulo {
            margin: 2px 0 0;
            color: var(--text-muted);
            font-size: 0.92rem;
        }

        .resumo {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .resumo-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            min-width: 120px;
            box-shadow: var(--shadow);
        }

        .resumo-item span {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 600;
        }

        .resumo-item strong {
            font-size: 1.25rem;
            font-variant-numeric: tabular-nums;
        }

        /* ---------- Grade e cartões ---------- */
        .grade {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .grade + .grade {
            margin-top: 20px;
        }

        .cartao {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            min-width: 0;
        }

        .cartao-cabecalho {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .cartao-icone {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            background: var(--primary-soft);
            color: var(--primary);
        }

        .cartao-icone.produto {
            background: var(--accent-soft);
            color: var(--accent);
        }

        h2 {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .contador {
            margin-left: auto;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 2px 10px;
            font-variant-numeric: tabular-nums;
        }

        /* ---------- Formulários ---------- */
        .campo {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        input[type="text"], input[type="email"], input[type="number"] {
            width: 100%;
            padding: 11px 14px;
            font: inherit;
            font-size: 0.95rem;
            color: var(--text);
            background: var(--surface-alt);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            transition: border-color 0.15s, box-shadow 0.15s, background-color 0.15s;
        }

        input::placeholder {
            color: var(--text-muted);
            opacity: 0.7;
        }

        input:focus {
            outline: none;
            background: var(--surface);
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--primary-soft);
        }

        button {
            font: inherit;
            cursor: pointer;
            border: none;
        }

        .btn-primario {
            width: 100%;
            padding: 12px 20px;
            margin-top: 4px;
            font-weight: 600;
            color: #fff;
            background: var(--primary);
            border-radius: var(--radius-sm);
            transition: background-color 0.15s, transform 0.05s;
        }

        .btn-primario:hover {
            background: var(--primary-hover);
        }

        .btn-primario:active {
            transform: translateY(1px);
        }

        .btn-primario:focus-visible, .btn-excluir:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        .btn-excluir {
            width: 34px;
            height: 34px;
            display: inline-grid;
            place-items: center;
            color: var(--text-muted);
            background: transparent;
            border-radius: 8px;
            transition: background-color 0.15s, color 0.15s;
        }

        .btn-excluir:hover {
            color: var(--danger);
            background: var(--danger-soft);
        }

        /* ---------- Alertas ---------- */
        .alerta {
            margin: 0 0 16px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 0.88rem;
            font-weight: 500;
            animation: surgir 0.2s ease-out;
        }

        .alerta[hidden] {
            display: none;
        }

        .alerta-sucesso {
            color: var(--success);
            background: var(--success-soft);
        }

        .alerta-erro {
            color: var(--danger);
            background: var(--danger-soft);
        }

        @keyframes surgir {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: none; }
        }

        /* ---------- Tabelas ---------- */
        .tabela-rolavel {
            overflow-x: auto;
            margin: 0 -24px -24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            font-size: 0.92rem;
        }

        th {
            text-align: left;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            background: var(--surface-alt);
            padding: 10px 24px;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 12px 24px;
            border-bottom: 1px solid var(--border);
            overflow-wrap: break-word;
            vertical-align: middle;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr {
            transition: background-color 0.12s;
        }

        tbody tr:hover {
            background: var(--surface-alt);
        }

        th.col-nome {
            width: 42%;
        }

        th.preco {
            width: 140px;
        }

        td.preco, th.preco {
            text-align: right;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            font-weight: 600;
        }

        th.acoes {
            width: 64px;
        }

        td.acoes {
            text-align: right;
            padding-left: 0;
        }

        .secundario {
            color: var(--text-muted);
        }

        .pessoa {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 500;
        }

        .pessoa-email {
            display: none;
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-muted);
        }

        .pessoa-texto {
            min-width: 0;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--primary);
            background: var(--primary-soft);
        }

        /* ---------- Estado vazio ---------- */
        .vazio {
            text-align: center;
            padding: 28px 16px 36px;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
        }

        .vazio svg {
            display: block;
            margin: 0 auto 10px;
            opacity: 0.5;
        }

        .vazio strong {
            display: block;
            color: var(--text);
            font-weight: 600;
            margin-bottom: 2px;
        }

        @media (max-width: 760px) {
            .pagina {
                padding: 20px 16px 40px;
            }

            .grade {
                grid-template-columns: minmax(0, 1fr);
            }

            .cartao {
                padding: 20px;
            }

            .tabela-rolavel {
                margin: 0 -20px -20px;
            }

            th, td {
                padding-left: 20px;
                padding-right: 20px;
            }

            .resumo {
                width: 100%;
            }

            /* No celular o e-mail vai para baixo do nome, liberando a coluna. */
            .col-email {
                display: none;
            }

            th.col-nome {
                width: auto;
            }

            th.preco {
                width: 116px;
            }

            .pessoa-email {
                display: block;
            }

            .resumo-item {
                flex: 1;
                min-width: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>

    <div class="pagina">
        <header class="topo">
            <div class="marca">
                <div class="marca-icone" aria-hidden="true">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
                </div>
                <div>
                    <h1>Sistema de Gestão</h1>
                    <p class="subtitulo">Cadastro de clientes e produtos</p>
                </div>
            </div>
            <div class="resumo" aria-label="Resumo">
                <div class="resumo-item"><span>Clientes</span><strong id="total-clientes">0</strong></div>
                <div class="resumo-item"><span>Produtos</span><strong id="total-produtos">0</strong></div>
            </div>
        </header>

        <main>
            <div class="grade">
                <!-- FORMULÁRIO: CADASTRO DE CLIENTES -->
                <section class="cartao">
                    <div class="cartao-cabecalho">
                        <div class="cartao-icone" aria-hidden="true">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
                        </div>
                        <h2>Novo cliente</h2>
                    </div>
                    <p id="msg-cliente" class="alerta" role="status" aria-live="polite" hidden></p>
                    <form id="form-cliente" novalidate>
                        <div class="campo">
                            <label for="cli-nome">Nome completo</label>
                            <input type="text" id="cli-nome" required maxlength="120" autocomplete="name" placeholder="Ex.: Maria da Silva">
                        </div>
                        <div class="campo">
                            <label for="cli-email">E-mail institucional</label>
                            <input type="email" id="cli-email" required maxlength="120" autocomplete="email" placeholder="nome@empresa.com.br">
                        </div>
                        <button type="submit" class="btn-primario">Registrar cliente</button>
                    </form>
                </section>

                <!-- FORMULÁRIO: CADASTRO DE PRODUTOS -->
                <section class="cartao">
                    <div class="cartao-cabecalho">
                        <div class="cartao-icone produto" aria-hidden="true">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>
                        </div>
                        <h2>Novo produto</h2>
                    </div>
                    <p id="msg-produto" class="alerta" role="status" aria-live="polite" hidden></p>
                    <form id="form-produto" novalidate>
                        <div class="campo">
                            <label for="prod-nome">Descrição do produto</label>
                            <input type="text" id="prod-nome" required maxlength="120" placeholder="Ex.: Caneta esferográfica azul">
                        </div>
                        <div class="campo">
                            <label for="prod-preco">Preço unitário (R$)</label>
                            <input type="number" step="0.01" id="prod-preco" required min="0" inputmode="decimal" placeholder="0,00">
                        </div>
                        <button type="submit" class="btn-primario">Registrar produto</button>
                    </form>
                </section>
            </div>

            <div class="grade">
                <!-- LISTAGEM DE CLIENTES -->
                <section class="cartao">
                    <div class="cartao-cabecalho">
                        <h2>Clientes cadastrados</h2>
                        <span id="contador-clientes" class="contador"></span>
                    </div>
                    <div id="container-tabela-clientes" class="tabela-rolavel"></div>
                </section>

                <!-- LISTAGEM DE PRODUTOS -->
                <section class="cartao">
                    <div class="cartao-cabecalho">
                        <h2>Produtos cadastrados</h2>
                        <span id="contador-produtos" class="contador"></span>
                    </div>
                    <div id="container-lista-produtos" class="tabela-rolavel"></div>
                </section>
            </div>
        </main>
    </div>

    <script>
        /**
         * Módulo de gerenciamento de clientes e produtos.
         * Todo texto vindo do usuário é inserido via textContent (nunca innerHTML),
         * para evitar injeção de HTML/script a partir dos dados salvos.
         */
        (function() {
            'use strict';

            // Camada de persistência local (localStorage), tolerante a dados corrompidos
            // e a navegadores que bloqueiam o armazenamento.
            const repositorio = {
                obter(chave) {
                    try {
                        const dados = JSON.parse(localStorage.getItem(chave));
                        return Array.isArray(dados) ? dados : [];
                    } catch (erro) {
                        console.warn(`Dados inválidos em "${chave}"; iniciando lista vazia.`, erro);
                        return [];
                    }
                },
                salvar(chave, dados) {
                    try {
                        localStorage.setItem(chave, JSON.stringify(dados));
                        return true;
                    } catch (erro) {
                        console.error(`Não foi possível salvar "${chave}".`, erro);
                        return false;
                    }
                }
            };

            function gerarId() {
                if (window.crypto && typeof crypto.randomUUID === 'function') {
                    return crypto.randomUUID();
                }
                return Date.now().toString(36) + Math.random().toString(36).slice(2);
            }

            // Registros antigos (da versão anterior) não têm id; atribui um na carga.
            function normalizar(lista) {
                return lista.map(item => (item && item.id ? item : { ...item, id: gerarId() }));
            }

            let listaClientes = normalizar(repositorio.obter('clientes'));
            let listaProdutos = normalizar(repositorio.obter('produtos'));

            const formatadorMoeda = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });

            const dom = {
                formCliente: document.getElementById('form-cliente'),
                formProduto: document.getElementById('form-produto'),
                cliNome: document.getElementById('cli-nome'),
                cliEmail: document.getElementById('cli-email'),
                prodNome: document.getElementById('prod-nome'),
                prodPreco: document.getElementById('prod-preco'),
                tabelaClientes: document.getElementById('container-tabela-clientes'),
                listaProdutos: document.getElementById('container-lista-produtos'),
                contadorClientes: document.getElementById('contador-clientes'),
                contadorProdutos: document.getElementById('contador-produtos'),
                totalClientes: document.getElementById('total-clientes'),
                totalProdutos: document.getElementById('total-produtos')
            };

            /**
             * Cria um elemento com texto seguro (textContent).
             */
            function criar(tag, texto, classe) {
                const el = document.createElement(tag);
                if (texto !== undefined) el.textContent = texto;
                if (classe) el.className = classe;
                return el;
            }

            /**
             * Monta uma tabela genérica.
             * @param {Array<{titulo: string, classe?: string}>} colunas
             * @param {Array} itens
             * @param {(item) => Array<string|Node>} celulas - conteúdo de cada coluna
             */
            function montarTabela(colunas, itens, celulas) {
                const tabela = document.createElement('table');
                const thead = tabela.createTHead();
                const linhaCabecalho = thead.insertRow();
                colunas.forEach(coluna => {
                    const th = criar('th', coluna.titulo, coluna.classe);
                    th.scope = 'col';
                    linhaCabecalho.appendChild(th);
                });

                const tbody = tabela.createTBody();
                itens.forEach(item => {
                    const linha = tbody.insertRow();
                    celulas(item).forEach((conteudo, i) => {
                        const td = linha.insertCell();
                        if (colunas[i].classe) td.className = colunas[i].classe;
                        if (conteudo instanceof Node) td.appendChild(conteudo);
                        else td.textContent = conteudo;
                    });
                });
                return tabela;
            }

            /**
             * Estado vazio com ícone, título e dica.
             */
            function estadoVazio(titulo, dica) {
                const caixa = criar('div', undefined, 'vazio');
                caixa.insertAdjacentHTML('afterbegin',
                    '<svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>');
                caixa.append(criar('strong', titulo), criar('span', dica));
                return caixa;
            }

            function iniciais(nome) {
                const partes = String(nome).trim().split(/\s+/).filter(Boolean);
                if (partes.length === 0) return '?';
                const primeira = partes[0][0];
                const ultima = partes.length > 1 ? partes[partes.length - 1][0] : '';
                return (primeira + ultima).toUpperCase();
            }

            /**
             * E-mail com ponto de quebra após o "@", para não partir o domínio ao meio.
             */
            function textoEmail(email, classe) {
                const el = criar('span', undefined, classe);
                const texto = String(email);
                const arroba = texto.indexOf('@');
                if (arroba < 0) {
                    el.textContent = texto;
                } else {
                    el.append(texto.slice(0, arroba + 1), document.createElement('wbr'), texto.slice(arroba + 1));
                }
                return el;
            }

            function celulaPessoa(nome, email) {
                const caixa = criar('div', undefined, 'pessoa');
                const avatar = criar('span', iniciais(nome), 'avatar');
                avatar.setAttribute('aria-hidden', 'true');
                const texto = criar('div', undefined, 'pessoa-texto');
                texto.append(criar('div', nome), textoEmail(email, 'pessoa-email'));
                caixa.append(avatar, texto);
                return caixa;
            }

            function botaoExcluir(rotulo, aoClicar) {
                const botao = criar('button', undefined, 'btn-excluir');
                botao.type = 'button';
                botao.title = 'Excluir';
                botao.setAttribute('aria-label', rotulo);
                botao.insertAdjacentHTML('afterbegin',
                    '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/></svg>');
                botao.addEventListener('click', aoClicar);
                return botao;
            }

            function renderizarClientes() {
                dom.contadorClientes.textContent = listaClientes.length;
                dom.totalClientes.textContent = listaClientes.length;

                if (listaClientes.length === 0) {
                    dom.tabelaClientes.replaceChildren(estadoVazio('Nenhum cliente ainda', 'Use o formulário acima para cadastrar o primeiro.'));
                    return;
                }

                const tabela = montarTabela(
                    [{ titulo: 'Nome', classe: 'col-nome' }, { titulo: 'E-mail', classe: 'col-email' }, { titulo: '', classe: 'acoes' }],
                    listaClientes,
                    cliente => [
                        celulaPessoa(cliente.nome, cliente.email),
                        textoEmail(cliente.email, 'secundario'),
                        botaoExcluir(`Excluir cliente ${cliente.nome}`, () => excluirCliente(cliente.id))
                    ]
                );
                dom.tabelaClientes.replaceChildren(tabela);
            }

            function renderizarProdutos() {
                dom.contadorProdutos.textContent = listaProdutos.length;
                dom.totalProdutos.textContent = listaProdutos.length;

                if (listaProdutos.length === 0) {
                    dom.listaProdutos.replaceChildren(estadoVazio('Nenhum produto ainda', 'Use o formulário acima para cadastrar o primeiro.'));
                    return;
                }

                const tabela = montarTabela(
                    [{ titulo: 'Produto' }, { titulo: 'Preço', classe: 'preco' }, { titulo: '', classe: 'acoes' }],
                    listaProdutos,
                    produto => [
                        produto.nome,
                        Number.isFinite(produto.preco) ? formatadorMoeda.format(produto.preco) : '—',
                        botaoExcluir(`Excluir produto ${produto.nome}`, () => excluirProduto(produto.id))
                    ]
                );
                dom.listaProdutos.replaceChildren(tabela);
            }

            /**
             * Exibe uma mensagem temporária. Reinicia o temporizador se já houver
             * uma mensagem visível, para ela não sumir antes da hora.
             * @param {string} idElemento
             * @param {string} texto
             * @param {'sucesso'|'erro'} tipo
             */
            const temporizadores = {};
            function notificar(idElemento, texto, tipo) {
                const elemento = document.getElementById(idElemento);
                elemento.textContent = texto;
                elemento.className = `alerta alerta-${tipo}`;
                elemento.hidden = false;

                clearTimeout(temporizadores[idElemento]);
                temporizadores[idElemento] = setTimeout(() => {
                    elemento.hidden = true;
                }, tipo === 'erro' ? 5000 : 3000);
            }

            function excluirCliente(id) {
                const cliente = listaClientes.find(c => c.id === id);
                if (!cliente || !confirm(`Excluir o cliente "${cliente.nome}"?`)) return;

                listaClientes = listaClientes.filter(c => c.id !== id);
                repositorio.salvar('clientes', listaClientes);
                renderizarClientes();
            }

            function excluirProduto(id) {
                const produto = listaProdutos.find(p => p.id === id);
                if (!produto || !confirm(`Excluir o produto "${produto.nome}"?`)) return;

                listaProdutos = listaProdutos.filter(p => p.id !== id);
                repositorio.salvar('produtos', listaProdutos);
                renderizarProdutos();
            }

            dom.formCliente.addEventListener('submit', function(event) {
                event.preventDefault();

                const nome = dom.cliNome.value.trim();
                const email = dom.cliEmail.value.trim().toLowerCase();

                if (!nome) {
                    notificar('msg-cliente', 'Informe o nome do cliente.', 'erro');
                    dom.cliNome.focus();
                    return;
                }
                if (!email || !dom.cliEmail.checkValidity()) {
                    notificar('msg-cliente', 'Informe um e-mail válido.', 'erro');
                    dom.cliEmail.focus();
                    return;
                }
                if (listaClientes.some(c => String(c.email).toLowerCase() === email)) {
                    notificar('msg-cliente', 'Já existe um cliente com este e-mail.', 'erro');
                    dom.cliEmail.focus();
                    return;
                }

                listaClientes.push({ id: gerarId(), nome, email });
                if (!repositorio.salvar('clientes', listaClientes)) {
                    notificar('msg-cliente', 'Cliente adicionado, mas não foi possível salvar no navegador.', 'erro');
                } else {
                    notificar('msg-cliente', 'Cliente cadastrado com sucesso.', 'sucesso');
                }

                dom.formCliente.reset();
                dom.cliNome.focus();
                renderizarClientes();
            });

            dom.formProduto.addEventListener('submit', function(event) {
                event.preventDefault();

                const nome = dom.prodNome.value.trim();
                const preco = dom.prodPreco.valueAsNumber;

                if (!nome) {
                    notificar('msg-produto', 'Informe a descrição do produto.', 'erro');
                    dom.prodNome.focus();
                    return;
                }
                if (!Number.isFinite(preco) || preco < 0) {
                    notificar('msg-produto', 'Informe um preço válido (zero ou maior).', 'erro');
                    dom.prodPreco.focus();
                    return;
                }

                // Arredonda para centavos para evitar valores como 10.129999.
                listaProdutos.push({ id: gerarId(), nome, preco: Math.round(preco * 100) / 100 });
                if (!repositorio.salvar('produtos', listaProdutos)) {
                    notificar('msg-produto', 'Produto adicionado, mas não foi possível salvar no navegador.', 'erro');
                } else {
                    notificar('msg-produto', 'Produto cadastrado com sucesso.', 'sucesso');
                }

                dom.formProduto.reset();
                dom.prodNome.focus();
                renderizarProdutos();
            });

            // Persiste os ids atribuídos a registros antigos e faz a carga inicial.
            repositorio.salvar('clientes', listaClientes);
            repositorio.salvar('produtos', listaProdutos);
            renderizarClientes();
            renderizarProdutos();
        })();
    </script>
</body>
</html>
