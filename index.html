<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestão de Clientes e Produtos</title>
    <style>
        :root {
            --primary-color: #007BFF;
            --primary-hover: #0056b3;
            --bg-color: #f4f4f9;
            --text-color: #333;
            --border-color: #ddd;
            --success-color: #28a745;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 20px; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
        }
        
        .container { 
            display: flex; 
            gap: 20px; 
            flex-wrap: wrap; 
        }
        
        .box { 
            background: #fff; 
            padding: 20px; 
            border-radius: 8px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
            flex: 1; 
            min-width: 300px; 
        }
        
        h2 { 
            border-bottom: 2px solid var(--primary-color); 
            padding-bottom: 10px; 
            color: var(--primary-color); 
            margin-top: 0;
        }
        
        label {
            display: block;
            margin-top: 10px;
            font-weight: 600;
        }

        input[type="text"], input[type="email"], input[type="number"] { 
            width: 100%; 
            padding: 10px; 
            margin: 8px 0 15px 0; 
            box-sizing: border-box; 
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }
        
        button { 
            background-color: var(--primary-color); 
            color: #fff; 
            padding: 10px 20px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
            width: 100%;
        }
        
        button:hover { 
            background-color: var(--primary-hover); 
        }
        
        .alert-success { 
            color: var(--success-color); 
            font-weight: bold; 
            margin-bottom: 15px; 
            display: none; 
        }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            margin-top: 10px; 
        }
        
        table, th, td { 
            border: 1px solid var(--border-color); 
        }
        
        th, td { 
            padding: 12px; 
            text-align: left; 
        }
        
        th { 
            background-color: #f8f9fa; 
        }
        
        ul { 
            padding-left: 20px; 
            margin-top: 10px;
        }
        
        li { 
            margin-bottom: 8px; 
        }
    </style>
</head>
<body>

    <header>
        <h1>Sistema Corporativo de Gestão</h1>
    </header>
    
    <main class="container">
        <!-- FORMULÁRIO: CADASTRO DE CLIENTES -->
        <section class="box">
            <h2>Cadastro de Clientes</h2>
            <p id="msg-cliente" class="alert-success" role="alert">Cliente cadastrado com sucesso.</p>
            <form id="form-cliente">
                <label for="cli-nome">Nome Completo</label>
                <input type="text" id="cli-nome" required autocomplete="name">
                
                <label for="cli-email">E-mail Institucional</label>
                <input type="email" id="cli-email" required autocomplete="email">
                
                <button type="submit">Registrar Cliente</button>
            </form>
        </section>

        <!-- FORMULÁRIO: CADASTRO DE PRODUTOS -->
        <section class="box">
            <h2>Cadastro de Produtos</h2>
            <p id="msg-produto" class="alert-success" role="alert">Produto cadastrado com sucesso.</p>
            <form id="form-produto">
                <label for="prod-nome">Descrição do Produto</label>
                <input type="text" id="prod-nome" required>
                
                <label for="prod-preco">Preço Unitário (R\$)</label>
                <input type="number" step="0.01" id="prod-preco" required min="0">
                
                <button type="submit">Registrar Produto</button>
            </form>
        </section>
    </main>

    <div class="container" style="margin-top: 20px;">
        <!-- REPOSITÓRIO E LISTAGEM DE CLIENTES -->
        <section class="box" style="flex: 2;">
            <h2>Clientes Cadastrados</h2>
            <div id="container-tabela-clientes"></div>
        </section>

        <!-- REPOSITÓRIO E LISTAGEM DE PRODUTOS -->
        <section class="box">
            <h2>Produtos Cadastrados</h2>
            <div id="container-lista-produtos"></div>
        </section>
    </div>

    <script>
        /**
         * Inicialização do módulo de gerenciamento de dados do sistema.
         * Utiliza escopo isolado para segurança e integridade das variáveis.
         */
        (function() {
            'use strict';

            // Camada de Persistência local (LocalStorage)
            const repositorio = {
                obter: (chave) => JSON.parse(localStorage.getItem(chave)) || [],
                salvar: (chave, dados) => localStorage.setItem(chave, JSON.stringify(dados))
            };

            // Estados locais da aplicação
            let listaClientes = repositorio.obter('clientes');
            let listaProdutos = repositorio.obter('produtos');

            // Mapeamento de Elementos do DOM
            const dom = {
                formCliente: document.getElementById('form-cliente'),
                formProduto: document.getElementById('form-produto'),
                tabelaClientes: document.getElementById('container-tabela-clientes'),
                listaProdutos: document.getElementById('container-lista-produtos')
            };

            /**
             * Renderiza a tabela de clientes com base no estado atual.
             */
            function renderizarClientes() {
                if (listaClientes.length === 0) {
                    dom.tabelaClientes.innerHTML = '<p>Nenhum registro de cliente localizado.</p>';
                    return;
                }

                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>Nome</th>
                                <th>E-mail</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                listaClientes.forEach(cliente => {
                    html += `
                        <tr>
                            <td>${cliente.nome}</td>
                            <td>${cliente.email}</td>
                        </tr>
                    `;
                });

                html += '</tbody></table>';
                dom.tabelaClientes.innerHTML = html;
            }

            /**
             * Renderiza a listagem de produtos com base no estado atual.
             */
            function renderizarProdutos() {
                if (listaProdutos.length === 0) {
                    dom.listaProdutos.innerHTML = '<p>Nenhum registro de produto localizado.</p>';
                    return;
                }

                let html = '<ul>';
                listaProdutos.forEach(produto => {
                    const precoFormatado = produto.preco.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                    html += `<li>${produto.nome} — <strong>${precoFormatado}</strong></li>`;
                });
                html += '</ul>';
                
                dom.listaProdutos.innerHTML = html;
            }

            /**
             * Controla a exibição temporária de notificações de feedback.
             * @param {string} idElemento - ID do elemento de mensagem.
             */
            function dispararNotificacao(idElemento) {
                const elemento = document.getElementById(idElemento);
                elemento.style.display = 'block';
                setTimeout(() => {
                    elemento.style.display = 'none';
                }, 3000);
            }

            // Event Listener: Cadastro de Clientes
            dom.formCliente.addEventListener('submit', function(event) {
                event.preventDefault();
                
                const cliente = {
                    nome: document.getElementById('cli-nome').value.trim(),
                    email: document.getElementById('cli-email').value.trim()
                };

                listaClientes.push(cliente);
                repositorio.salvar('clientes', listaClientes);
                
                dom.formCliente.reset();
                dispararNotificacao('msg-cliente');
                renderizarClientes();
            });

            // Event Listener: Cadastro de Produtos
            dom.formProduto.addEventListener('submit', function(event) {
                event.preventDefault();
                
                const produto = {
                    nome: document.getElementById('prod-nome').value.trim(),
                    preco: parseFloat(document.getElementById('prod-preco').value)
                };

                listaProdutos.push(produto);
                repositorio.salvar('produtos', listaProdutos);
                
                dom.formProduto.reset();
                dispararNotificacao('msg-produto');
                renderizarProdutos();
            });

            // Execução Inicial (Carga de dados persistidos)
            renderizarClientes();
            renderizarProdutos();
        })();
    </script>
</body>
</html>
